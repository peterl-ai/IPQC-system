name: CI

on:
  push:
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ipqc_test
          POSTGRES_USER: ipqc_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipqc_test -d ipqc_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      IPQC_TEST_POSTGRES_DISPOSABLE: 'true'
      IPQC_TEST_POSTGRES_CONNECTION: 'Host=localhost;Port=5432;Database=ipqc_test;Username=ipqc_test;Password=synthetic-ci-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore api/JaxPower.Ipqc.slnx
      - run: dotnet build api/JaxPower.Ipqc.slnx --configuration Release --no-restore
      - run: dotnet test api/JaxPower.Ipqc.slnx --configuration Release --no-build --filter "FullyQualifiedName~PersonalSessionPostgresTests|FullyQualifiedName~LineSharedPlanningPostgresTests|FullyQualifiedName~WorkContextPostgresTests|FullyQualifiedName~InspectionIdentityPostgresTests|FullyQualifiedName~SharedDraftPostgresTests|FullyQualifiedName~ItemRemovalPostgresTests|FullyQualifiedName~PhotoPostgresTests|FullyQualifiedName~DraftAttachmentPostgresTests"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore api/JaxPower.Ipqc.slnx
      - run: dotnet build api/JaxPower.Ipqc.slnx --configuration Release --no-restore
      - run: dotnet test api/JaxPower.Ipqc.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
