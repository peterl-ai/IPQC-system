name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Gradle Wrapper
        working-directory: android/patrol-app
        run: echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
      - name: Install Android SDK platform
        run: |
          "${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify Android app
        working-directory: android/patrol-app
        run: ./gradlew --no-daemon -PIPQC_SERVER_URL= :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload Android debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipqc-android-debug-apk
          path: android/patrol-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Android instrumentation APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipqc-android-instrumentation-apk
          path: android/patrol-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ipqc_test
          POSTGRES_USER: ipqc_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipqc_test -d ipqc_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      IPQC_TEST_POSTGRES_DISPOSABLE: 'true'
      IPQC_TEST_POSTGRES_CONNECTION: 'Host=localhost;Port=5432;Database=ipqc_test;Username=ipqc_test;Password=synthetic-ci-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore api/JaxPower.Ipqc.slnx
      - run: dotnet build api/JaxPower.Ipqc.slnx --configuration Release --no-restore
      - run: dotnet test api/JaxPower.Ipqc.slnx --configuration Release --no-build --filter "FullyQualifiedName~PersonalSessionPostgresTests|FullyQualifiedName~LineSharedPlanningPostgresTests|FullyQualifiedName~WorkContextPostgresTests|FullyQualifiedName~InspectionIdentityPostgresTests|FullyQualifiedName~SharedDraftPostgresTests|FullyQualifiedName~ItemRemovalPostgresTests|FullyQualifiedName~PhotoPostgresTests|FullyQualifiedName~DraftAttachmentPostgresTests|FullyQualifiedName~UnableToMeasurePostgresTests|FullyQualifiedName~DraftEvidenceAssessmentPostgresTests|FullyQualifiedName~SampleEvidencePostgresTests|FullyQualifiedName~PhotoPolicyPostgresTests|FullyQualifiedName~SubmitPreflightPostgresTests|FullyQualifiedName~BasicInformationPostgresTests|FullyQualifiedName~PicRosterPostgresTests|FullyQualifiedName~NgPicSelectionPostgresTests|FullyQualifiedName~OrdinaryNgDetailsPostgresTests"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore api/JaxPower.Ipqc.slnx
      - run: dotnet build api/JaxPower.Ipqc.slnx --configuration Release --no-restore
      - run: dotnet test api/JaxPower.Ipqc.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
